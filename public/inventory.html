<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Manajemen Stok & Status Menu</title>
  <style>
    body { font-family: sans-serif; background: #f4f6f9; margin: 0; padding: 20px; }
    .container { max-width: 900px; margin: 0 auto; }
    .header-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; }
    .btn-back { background: #6c757d; color: white; padding: 8px 16px; border-radius: 6px; text-decoration: none; font-weight: bold; }
    
    table { width: 100%; border-collapse: collapse; background: white; border-radius: 8px; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
    th, td { padding: 12px 15px; text-align: left; border-bottom: 1px solid #eee; }
    th { background: #343a40; color: white; }
    .img-thumb { width: 50px; height: 50px; object-fit: cover; border-radius: 5px; }

    .status-badge { padding: 4px 10px; border-radius: 20px; font-size: 12px; font-weight: bold; }
    .badge-available { background: #d4edda; color: #155724; }
    .badge-soldout { background: #f8d7da; color: #721c24; }

    .btn-action { padding: 6px 12px; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }
    .btn-toggle { background: #ffc107; color: black; }
    .btn-stock { background: #17a2b8; color: white; margin-left: 5px; }
  </style>
</head>
<body>

  <div class="container">
    <div class="header-bar">
      <h1>📦 Manajemen Stok & Sold Out Menu</h1>
      <a href="/dashboard.html" class="btn-back">← Kembali ke Dashboard</a>
    </div>

    <table>
      <thead>
        <tr>
          <th>Foto</th>
          <th>Nama Menu</th>
          <th>Sisa Stok</th>
          <th>Status Jual</th>
          <th>Aksi Quick Update</th>
        </tr>
      </thead>
      <tbody id="inventory-table-body">
        <tr><td colspan="5" style="text-align:center; color:#888;">Memuat data stok...</td></tr>
      </tbody>
    </table>
  </div>

  <script>
    // Cek Session tanpa memicu blank
    const userRole = localStorage.getItem('userRole');
    if (!userRole) {
      alert('Silakan login terlebih dahulu!');
      window.location.href = '/login.html';
    }

    loadInventory();

    function loadInventory() {
      fetch('/api/menu')
        .then(res => {
          if (!res.ok) throw new Error('Gagal mengambil data dari server');
          return res.json();
        })
        .then(data => {
          const tbody = document.getElementById('inventory-table-body');
          tbody.innerHTML = '';
          
          if (data.length === 0) {
            tbody.innerHTML = '<tr><td colspan="5" style="text-align:center; color:#888;">Belum ada menu terdaftar.</td></tr>';
            return;
          }

          data.forEach(item => {
            const stockVal = item.stock !== undefined ? item.stock : 0;
            const isAvailable = item.isAvailable !== false && stockVal > 0;
            
            tbody.innerHTML += `
              <tr>
                <td><img src="${item.image || 'https://via.placeholder.com/50'}" class="img-thumb"></td>
                <td><strong>${item.name}</strong><br><small style="color:#666;">Rp ${(item.price || 0).toLocaleString('id-ID')}</small></td>
                <td><strong>${stockVal} porsi</strong></td>
                <td>
                  <span class="status-badge ${isAvailable ? 'badge-available' : 'badge-soldout'}">
                    ${isAvailable ? 'READY / TERSEDIA' : 'SOLD OUT / HABIS'}
                  </span>
                </td>
                <td>
                  <button class="btn-action btn-toggle" onclick="toggleStatus('${item.id}', ${!isAvailable})">
                    ${isAvailable ? 'Set Sold Out' : 'Set Ready'}
                  </button>
                  <button class="btn-action btn-stock" onclick="updateStockPrompt('${item.id}', ${stockVal})">
                    Edit Stok
                  </button>
                </td>
              </tr>`;
          });
        })
        .catch(err => {
          document.getElementById('inventory-table-body').innerHTML = `<tr><td colspan="5" style="color:red; text-align:center;">Error: ${err.message}. Pastikan server Node.js sudah berjalan.</td></tr>`;
        });
    }

    function toggleStatus(id, newStatus) {
      fetch(`/api/menu/${id}`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ isAvailable: newStatus })
      })
      .then(() => loadInventory());
    }

    function updateStockPrompt(id, currentStock) {
      const newStock = prompt('Masukkan jumlah sisa stok porsi baru:', currentStock);
      if (newStock !== null && newStock.trim() !== '') {
        const stockInt = parseInt(newStock);
        fetch(`/api/menu/${id}`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ stock: stockInt, isAvailable: stockInt > 0 })
        })
        .then(() => loadInventory());
      }
    }
  </script>
</body>
</html>
