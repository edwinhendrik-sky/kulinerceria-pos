<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Layar Dapur - Kitchen Display System</title>
  <script src="/socket.io/socket.io.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }
    body { background: #1e1e1e; color: #ffffff; padding: 20px; }
    
    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; border-bottom: 2px solid #333; padding-bottom: 15px; }
    .header h1 { font-size: 24px; color: #f39c12; display: flex; align-items: center; gap: 10px; }
    .status-online { background: #27ae60; color: white; padding: 6px 12px; border-radius: 20px; font-size: 12px; font-weight: bold; }

    .orders-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 20px; }
    
    .order-card { background: #2d2d2d; border-radius: 12px; border-top: 6px solid #e74c3c; padding: 18px; box-shadow: 0 4px 15px rgba(0,0,0,0.3); display: flex; flex-direction: column; justify-content: space-between; }
    .card-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; border-bottom: 1px solid #444; padding-bottom: 8px; }
    .table-title { font-size: 18px; font-weight: 800; color: #e74c3c; }
    .order-time { font-size: 12px; color: #aaa; }

    .items-list { list-style: none; margin-bottom: 20px; }
    .item-row { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-bottom: 1px dashed #444; font-size: 16px; font-weight: 600; }
    .item-row input[type="checkbox"] { width: 18px; height: 18px; cursor: pointer; accent-color: #27ae60; }
    .item-badge { background: #d35400; color: white; font-size: 10px; padding: 2px 6px; border-radius: 4px; text-transform: uppercase; margin-left: auto; }

    .btn-done { background: #27ae60; color: white; border: none; padding: 12px; border-radius: 8px; font-size: 15px; font-weight: bold; cursor: pointer; width: 100%; transition: background 0.2s; }
    .btn-done:hover { background: #219150; }

    .no-orders { grid-column: 1 / -1; text-align: center; color: #777; padding: 60px; font-size: 18px; }
  </style>
</head>
<body>

  <div class="header">
    <h1>🍳 Layar Dapur (Khusus Makanan & Sate Shao Kao)</h1>
    <span class="status-online">🟢 TERHUBUNG REALTIME</span>
  </div>

  <div class="orders-grid" id="orders-container">
    <div class="no-orders">Belum ada pesanan makanan aktif saat ini...</div>
  </div>

  <script>
    const socket = io();
    let activeOrders = [];

    // Dengarkan pesanan masuk secara Realtime
    socket.on('order-update', (orders) => {
      activeOrders = orders;
      renderOrders();
    });

    function renderOrders() {
      const container = document.getElementById('orders-container');
      container.innerHTML = '';

      let hasKitchenOrders = false;

      activeOrders.forEach(order => {
        // Filter item makanan utama ATAU sate shao kao
        const kitchenItems = order.items.filter(item => {
          const cat = (item.category || '').toLowerCase();
          const name = (item.name || '').toLowerCase();
          const id = (item.id || '').toLowerCase();

          return cat === 'kitchen' || cat === 'shaokao' || name.includes('sate') || name.includes('shao') || id.startsWith('sk');
        });

        // Jika pesanan mengandung makanan / sate
        if (kitchenItems.length > 0) {
          hasKitchenOrders = true;

          let itemsHTML = '';
          kitchenItems.forEach((item, index) => {
            const isSate = item.category === 'sate' || item.name.toLowerCase().includes('sate');
            itemsHTML += `
              <li class="item-row">
                <input type="checkbox" id="chk-${order.id}-${index}">
                <label for="chk-${order.id}-${index}">${item.name}</label>
                ${isSate ? '<span class="item-badge">SHAO KAO</span>' : ''}
              </li>
            `;
          });

          container.innerHTML += `
            <div class="order-card" id="card-${order.id}">
              <div>
                <div class="card-head">
                  <div class="table-title">MEJA ${order.table} - ${order.customerName || 'Pelanggan'}</div>
                  <div class="order-time">Masuk: ${order.time || 'Baru Saja'}</div>
                </div>
                <ul class="items-list">
                  ${itemsHTML}
                </ul>
              </div>
              <button class="btn-done" onclick="finishOrder('${order.id}')">Selesai Masak</button>
            </div>
          `;
        }
      });

      if (!hasKitchenOrders) {
        container.innerHTML = `<div class="no-orders">Belum ada pesanan makanan/sate aktif saat ini...</div>`;
      }
    }

    function finishOrder(orderId) {
      if (confirm('Tandai pesanan makanan ini sudah selesai dimasak?')) {
        socket.emit('complete-kitchen-order', orderId);
      }
    }
  </script>
</body>
</html>
