<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Laporan & Database Membership - Shao Kao POS</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }
    body { background: #f8fafc; color: #0f172a; padding: 25px; }
    .container { max-width: 1100px; margin: 0 auto; }

    .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; }
    .top-bar h1 { font-size: 22px; font-weight: 800; color: #1e293b; }
    .btn-back { background: #64748b; color: white; padding: 10px 18px; border-radius: 8px; text-decoration: none; font-weight: 700; font-size: 13px; }

    /* Summary Metric Cards */
    .summary-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 20px; margin-bottom: 25px; }
    .stat-card { background: white; border-radius: 14px; padding: 20px; border: 1px solid #e2e8f0; box-shadow: 0 2px 6px rgba(0,0,0,0.03); }
    .stat-label { font-size: 13px; font-weight: 700; color: #64748b; text-transform: uppercase; margin-bottom: 6px; }
    .stat-value { font-size: 28px; font-weight: 800; color: #c0392b; }

    /* Table Styling */
    .card-table { background: white; border-radius: 14px; padding: 20px; border: 1px solid #e2e8f0; box-shadow: 0 2px 6px rgba(0,0,0,0.03); }
    .table-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
    .table-header h3 { font-size: 16px; font-weight: 700; }
    
    table { width: 100%; border-collapse: collapse; text-align: left; }
    th, td { padding: 12px 16px; border-bottom: 1px solid #e2e8f0; font-size: 14px; }
    th { background: #f1f5f9; color: #475569; font-weight: 700; }

    .badge-points { background: #fef3c7; color: #d97706; padding: 4px 10px; border-radius: 12px; font-weight: 800; font-size: 12px; border: 1px solid #fde68a; }
    .empty-msg { text-align: center; color: #94a3b8; padding: 30px; font-size: 14px; }
  </style>
</head>
<body>

  <div class="container">
    <div class="top-bar">
      <h1>👥 Laporan & Database Membership Pelanggan</h1>
      <a href="/dashboard.html" class="btn-back">← Kembali ke Dashboard</a>
    </div>

    <!-- Metric Summary -->
    <div class="summary-grid">
      <div class="stat-card">
        <div class="stat-label">Total Member Terdaftar</div>
        <div class="stat-value" id="summary-total-members">0</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Total Poin Beredar</div>
        <div class="stat-value" id="summary-total-points">0 Poin</div>
      </div>
    </div>

    <!-- Member List Table -->
    <div class="card-table">
      <div class="table-header">
        <h3>Daftar Pelanggan Setia (Urutan Poin Tertinggi)</h3>
      </div>

      <table>
        <thead>
          <tr>
            <th>No. WhatsApp / HP</th>
            <th>Nama Pelanggan</th>
            <th>Total Poin Loyalitas</th>
            <th>Tanggal Terdaftar</th>
          </tr>
        </thead>
        <tbody id="member-table-body">
          <tr><td colspan="4" class="empty-msg">Memuat data member...</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <script>
    // Load Ringkasan
    fetch('/api/members-summary')
      .then(res => res.json())
      .then(data => {
        document.getElementById('summary-total-members').innerText = (data.total_members || 0) + ' Pelanggan';
        document.getElementById('summary-total-points').innerText = (data.total_points || 0) + ' Poin';
      });

    // Load Daftar Tabel Member
    fetch('/api/members-list')
      .then(res => res.json())
      .then(members => {
        const tbody = document.getElementById('member-table-body');
        tbody.innerHTML = '';

        if (members.length === 0) {
          tbody.innerHTML = `<tr><td colspan="4" class="empty-msg">Belum ada pelanggan terdaftar sebagai member.</td></tr>`;
          return;
        }

        members.forEach(m => {
          tbody.innerHTML += `
            <tr>
              <td><strong>${m.phone}</strong></td>
              <td>${m.name}</td>
              <td><span class="badge-points">⭐ ${m.points} Poin</span></td>
              <td>${m.createdAt || '-'}</td>
            </tr>
          `;
        });
      });
  </script>
</body>
</html>
