<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Manajemen Stok & Bahan Baku - Shao Kao</title>
  <style>
    body { font-family: 'Segoe UI', sans-serif; padding: 20px; background: #f8fafc; margin: 0; }
    .header-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
    .btn-back { background: #64748b; color: white; padding: 8px 16px; border-radius: 6px; text-decoration: none; font-weight: bold; }
    
    .table-box { background: white; border-radius: 10px; padding: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); border: 1px solid #e2e8f0; }
    table { width: 100%; border-collapse: collapse; text-align: left; }
    th, td { padding: 12px; border-bottom: 1px solid #e2e8f0; }
    th { background: #f1f5f9; color: #475569; font-size: 14px; }
    
    .stock-input { width: 70px; padding: 6px; border: 1px solid #cbd5e0; border-radius: 4px; font-weight: bold; text-align: center; }
    .btn-save { background: #2563eb; color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-weight: bold; }
    
    .badge-status { padding: 4px 8px; border-radius: 4px; font-size: 11px; font-weight: bold; color: white; }
    .bg-available { background: #16a34a; }
    .bg-empty { background: #dc2626; }
    .btn-toggle { padding: 6px 10px; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; color: white; }
  </style>
</head>
<body>

  <div class="header-bar">
    <h1>📦 Manajemen Stok & Porsi Shao Kao</h1>
    <a href="/dashboard.html" class="btn-back">← Kembali ke Dashboard</a>
  </div>

  <div class="table-box">
    <table>
      <thead>
        <tr>
          <th>Foto</th>
          <th>Nama Menu</th>
          <th>Kategori</th>
          <th>Sisa Porsi Stok</th>
          <th>Status</th>
          <th>Aksi Ubah Status</th>
        </tr>
      </thead>
      <tbody id="inventory-table-body"></tbody>
    </table>
  </div>

  <script>
    const userRole = localStorage.getItem('userRole');
    if (!userRole) window.location.href = '/login.html';

    function loadInventory() {
      fetch('/api/menu')
        .then(res => res.json())
        .then(menus => {
          const tbody = document.getElementById('inventory-table-body');
          tbody.innerHTML = '';

          menus.forEach(menu => {
            const isAvail = menu.isAvailable && menu.stock > 0;
            tbody.innerHTML += `
              <tr>
                <td><img src="${menu.image || 'https://via.placeholder.com/50'}" width="50" height="50" style="object-fit:cover; border-radius:6px;"></td>
                <td><strong>${menu.name}</strong></td>
                <td><span style="text-transform:uppercase; font-size:12px; color:#64748b;">${menu.category}</span></td>
                <td>
                  <input type="number" id="stock-${menu.id}" value="${menu.stock}" class="stock-input">
                  <button class="btn-save" onclick="updateStock('${menu.id}')">Simpan</button>
                </td>
                <td>
                  <span class="badge-status ${isAvail ? 'bg-available' : 'bg-empty'}">
                    ${isAvail ? 'TERSEDIA' : 'HABIS'}
                  </span>
                </td>
                <td>
                  <button class="btn-toggle" style="background: ${isAvail ? '#dc2626' : '#16a34a'}" onclick="toggleAvailability('${menu.id}', ${!menu.isAvailable})">
                    ${isAvail ? 'Tandai Habis' : 'Tandai Tersedia'}
                  </button>
                </td>
              </tr>
            `;
          });
        });
    }

    function updateStock(id) {
      const newStock = parseInt(document.getElementById(`stock-${id}`).value) || 0;
      const isAvailable = newStock > 0 ? 1 : 0;

      fetch(`/api/menu/${id}`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ stock: newStock, isAvailable: isAvailable })
      })
      .then(res => res.json())
      .then(data => {
        if (data.success) {
          alert('Stok berhasil diperbarui!');
          loadInventory();
        }
      });
    }

    function toggleAvailability(id, currentStatus) {
      fetch(`/api/menu/${id}`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ isAvailable: currentStatus ? 1 : 0 })
      })
      .then(res => res.json())
      .then(data => {
        if (data.success) loadInventory();
      });
    }

    loadInventory();
  </script>
</body>
</html>
