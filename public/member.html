<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Database Pelanggan & Member - Shao Kao</title>
  <style>
    body { font-family: 'Segoe UI', sans-serif; padding: 20px; background: #f8fafc; }
    .header-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
    .btn-back { background: #64748b; color: white; padding: 8px 16px; border-radius: 6px; text-decoration: none; font-weight: bold; }
    .card { background: white; padding: 20px; border-radius: 10px; border: 1px solid #e2e8f0; }
    table { width: 100%; border-collapse: collapse; text-align: left; }
    th, td { padding: 12px; border-bottom: 1px solid #e2e8f0; }
    th { background: #f1f5f9; color: #475569; }
    .badge-point { background: #d97706; color: white; padding: 4px 8px; border-radius: 12px; font-weight: bold; font-size: 12px; }
  </style>
</head>
<body>

  <div class="header-bar">
    <h1>👥 Database Member & Poin Loyalitas</h1>
    <a href="/dashboard.html" class="btn-back">← Kembali ke Dashboard</a>
  </div>

  <div class="card">
    <table>
      <thead>
        <tr>
          <th>No. WhatsApp / HP</th>
          <th>Nama Pelanggan</th>
          <th>Total Poin Loyalitas</th>
          <th>Tanggal Terdaftar</th>
        </tr>
      </thead>
      <tbody id="member-table-body"></tbody>
    </table>
  </div>

  <script>
    fetch('/api/members-list')
      .then(res => res.json())
      .then(members => {
        const tbody = document.getElementById('member-table-body');
        tbody.innerHTML = '';
        members.forEach(m => {
          tbody.innerHTML += `
            <tr>
              <td><strong>${m.phone}</strong></td>
              <td>${m.name}</td>
              <td><span class="badge-point">⭐ ${m.points} Poin</span></td>
              <td>${m.createdAt}</td>
            </tr>
          `;
        });
      });
  </script>
</body>
</html>
